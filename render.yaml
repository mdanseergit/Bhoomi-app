# ---------------------------------------------------------------------------
# render.yaml — Render deployment blueprint for BHOOMI Backend API
# ---------------------------------------------------------------------------
services:
  - type: web
    name: bhoomi-api
    runtime: python
    rootDir: apps/api
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://bhoomi-app-in.vercel.app,https://bhoomi-app-five.vercel.app,https://bhoomi-app-live.vercel.app,https://bhoomi-agri-app.vercel.app,https://bhoomi-app-mdanseergits-projects.vercel.app
      - key: CORS_ORIGINS
        value: https://bhoomi-app-in.vercel.app,https://bhoomi-app-five.vercel.app,https://bhoomi-app-live.vercel.app,https://bhoomi-agri-app.vercel.app,https://bhoomi-app-mdanseergits-projects.vercel.app
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: AI_PRIMARY_MODEL
        value: z-ai/glm-5.3-flash
      - key: AI_FALLBACK_MODEL
        value: deepseek-ai/deepseek-v4.1-flash
      - key: AI_PROVIDER_ORDER
        value: nvidia,deterministic
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: SATELLITE_PROVIDER
        value: copernicus
      - key: DISEASE_MODEL_PROVIDER
        value: bhoomi-vision-v1
      - key: WEATHER_FALLBACK_PROVIDER
        value: nasa_power
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./var/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "8"
      - key: WEB_CONCURRENCY
        value: "1"
